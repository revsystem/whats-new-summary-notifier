# Run dependency and secret audits on push to main and on pull requests.
# Fails if npm audit or pip-audit report known vulnerabilities, or if
# gitleaks finds a secret in the commit history.
name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit
        # Remaining vulnerabilities are in aws-cdk-lib's bundled minimatch@3.1.2 (high,
        # GHSA-3ppc-4f35-3m26) and ajv@8.17.1 (moderate, GHSA-2g4f-4pwh-qvx6). Both are
        # bundled inside aws-cdk-lib and cannot be overridden externally. eslint and
        # @typescript-eslint minimatch chains are mitigated via package.json overrides.
        # Waiting for aws-cdk-lib to update its bundled dependencies.
        run: npm audit --audit-level=critical

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (notify-to-app)
        run: |
          python -m venv .venv-notify
          .venv-notify/bin/python -m pip install --upgrade pip -q
          .venv-notify/bin/pip install -r lambda/notify-to-app/requirements.txt -q
          .venv-notify/bin/pip install pip-audit -q
          .venv-notify/bin/pip-audit

      - name: pip-audit (rss-crawler)
        run: |
          python -m venv .venv-rss
          .venv-rss/bin/python -m pip install --upgrade pip -q
          .venv-rss/bin/pip install -r lambda/rss-crawler/requirements.txt -q
          .venv-rss/bin/pip install pip-audit -q
          .venv-rss/bin/pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the commit history, not just the checked out tree.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        # The gitleaks-action wrapper requires a GITLEAKS_LICENSE for
        # organization-owned repositories, so the release binary is used directly.
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: gitleaks
        run: gitleaks git --redact --no-banner --exit-code 1 .
